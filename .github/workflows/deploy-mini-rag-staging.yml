name: Deploy NileGuide mini-rag Staging

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Specific commit SHA to deploy (must be ancestor of approved branch)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Perform dry-run validation only (default: true for safety)'
        required: false
        default: true
        type: boolean
      target_provider:
        description: 'Target staging provider'
        required: true
        default: 'vercel'
        type: choice
        options:
          - vercel
          - docker_container

permissions:
  contents: read

concurrency:
  group: staging-deploy-mini-rag
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: Validate and Test mini-rag Staging
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve_commit.outputs.sha }}
    steps:
      - name: Checkout Codebase (Full History for Ancestry Verification)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Enforce Branch Restrictions and Verify Commit Ancestry
        id: resolve_commit
        run: |
          CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Evaluating branch restriction for: $CURRENT_BRANCH"
          if [[ "$CURRENT_BRANCH" != "fix/phase-1.1-staging-hardening" ]] && [[ ! "$CURRENT_BRANCH" =~ ^release/ ]]; then
            echo "CRITICAL SECURITY VIOLATION: Staging deployment is restricted to 'fix/phase-1.1-staging-hardening' or 'release/*'. Current branch: $CURRENT_BRANCH"
            exit 1
          fi

          TARGET_SHA="${{ inputs.commit_sha }}"
          if [ -n "$TARGET_SHA" ]; then
            echo "Validating that custom commit SHA $TARGET_SHA belongs to $CURRENT_BRANCH history..."
            if ! git merge-base --is-ancestor "$TARGET_SHA" HEAD; then
              echo "CRITICAL SECURITY VIOLATION: Commit SHA $TARGET_SHA is not an ancestor of $CURRENT_BRANCH (HEAD)! Aborting deployment."
              exit 1
            fi
            echo "Ancestry verification passed for commit: $TARGET_SHA"
            git checkout "$TARGET_SHA"
          else
            TARGET_SHA="${{ github.sha }}"
          fi
          echo "sha=$TARGET_SHA" >> $GITHUB_OUTPUT
          echo "Selected and verified commit SHA: $TARGET_SHA"

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx redis pydantic-settings

      - name: Run Automated Test Suite
        run: pytest tests/ -v

  deploy-staging:
    name: Deploy to Staging Environment
    needs: validate-and-test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate-and-test.outputs.commit_sha }}

      - name: Validate Deployment Target Safety Guardrail
        env:
          STAGING_URL: ${{ secrets.STAGING_MINI_RAG_URL || vars.STAGING_MINI_RAG_URL }}
        run: |
          echo "Running pre-flight URL safety check..."
          # Guard against production endpoint overwrite
          if [[ "$STAGING_URL" =~ "mini-rag-alpha.vercel.app" ]] || [[ "$STAGING_URL" =~ "nileguide.runasp.net" ]]; then
            echo "CRITICAL SAFETY VIOLATION: Staging URL points to production! Aborting immediately."
            exit 1
          fi
          # Guard against placeholder domains
          if [[ "$STAGING_URL" =~ "example.com" ]]; then
            echo "CRITICAL CONFIG ERROR: Staging mini-rag URL is an unconfigured placeholder (*.example.com)! Aborting immediately."
            exit 1
          fi
          echo "Target URL safety check passed: $STAGING_URL"

      - name: Execute Staging Deployment (Vercel)
        if: ${{ inputs.target_provider == 'vercel' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "[DRY RUN / SIMULATION MODE]"
            echo "Provider: Vercel Staging"
            echo "Deployment parameters verified. Cloud upload skipped."
          else
            if [ -z "$VERCEL_PROJECT_ID" ]; then
              echo "CRITICAL CONFIG ERROR: VERCEL_STAGING_PROJECT_ID is not configured in environment secrets! Aborting."
              exit 1
            fi
            if [[ "$VERCEL_PROJECT_ID" =~ "mini-rag-alpha" ]]; then
              echo "CRITICAL SAFETY VIOLATION: VERCEL_STAGING_PROJECT_ID references production project 'mini-rag-alpha'! Aborting immediately."
              exit 1
            fi
            echo "Deploying mini-rag to Vercel Staging (project ID: $VERCEL_PROJECT_ID)..."
            npx vercel deploy --prod --token "$VERCEL_TOKEN"
          fi

      - name: Execute Staging Deployment (Docker Container)
        if: ${{ inputs.target_provider == 'docker_container' }}
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          IMAGE_NAME: nileguide-mini-rag-staging
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ] || [ -z "$REGISTRY" ]; then
            echo "[DRY RUN / SIMULATION MODE]"
            echo "Provider: Docker Container Staging"
            echo "Image: nileguide-mini-rag-staging"
            echo "Deployment parameters verified. Docker push skipped."
          else
            echo "Building and pushing container image..."
            docker build -t "$REGISTRY/$IMAGE_NAME:${{ needs.validate-and-test.outputs.commit_sha }}" .
            docker push "$REGISTRY/$IMAGE_NAME:${{ needs.validate-and-test.outputs.commit_sha }}"
          fi

      - name: Post-Deployment Smoke Verification
        env:
          STAGING_URL: ${{ secrets.STAGING_MINI_RAG_URL || vars.STAGING_MINI_RAG_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ] || [ -z "$STAGING_URL" ]; then
            echo "Skipping live HTTP probe (dry run or staging URL not configured)."
          else
            echo "Probing staging mini-rag root endpoint: $STAGING_URL/"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$STAGING_URL/" || echo "000")
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "WARNING: Root health probe returned status $HTTP_STATUS"
            else
              echo "Smoke probe passed with HTTP $HTTP_STATUS"
            fi
          fi
