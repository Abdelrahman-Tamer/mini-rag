name: CI - NileGuide mini-rag

on:
  push:
    branches:
      - main
      - 'fix/*'
      - 'feature/*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-mini-rag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test mini-rag Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx redis pydantic-settings

      - name: Run Automated Test Suite (pytest)
        run: pytest tests/ -v
